<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("login.page_title") }}</title>
  <link rel="stylesheet" href="{{ url_for('operator_static', path='operator.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <form method="post" action="{{ language_switch_path }}" class="inline-form language-switcher login-language-switcher">
      <input type="hidden" name="next" value="{{ language_next_path }}">
      <label for="operator-language-login">{{ t("language.label") }}</label>
      <select id="operator-language-login" name="language" onchange="this.form.submit()">
        {% for option in language_options %}
        <option value="{{ option.code }}" {% if option.code == lang %}selected{% endif %}>{{ option.label }}</option>
        {% endfor %}
      </select>
      <noscript>
        <button type="submit" class="button secondary">{{ t("language.switch") }}</button>
      </noscript>
    </form>
    <h1>{{ t("app.console_name") }}</h1>
    <p>{{ t("login.subtitle") }}</p>
    {% if not auth_configured %}
    <div class="alert error">
      {{ t("login.not_configured") }}
    </div>
    {% endif %}
    {% if error_message %}
    <div class="alert error">{{ error_message }}</div>
    {% endif %}
    <form method="post" action="/operator/login">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="username">{{ t("login.username") }}</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">{{ t("login.password") }}</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="button">{{ t("login.sign_in") }}</button>
    </form>
    <p class="quiet">{{ t("login.ui_session_note") }}</p>
  </main>
</body>
</html>

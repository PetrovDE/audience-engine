version: 1
registry: integration_registry
owner: platform-operations
updated_at: 2026-04-09
sources:
  - source_id: snapshot_jsonl
    display_name: Local Snapshot JSONL
    kind: source
    implementation_status: implemented
    supported_modes:
      - minimal_slice
    description: Build feature mart from locally generated governed snapshot JSONL.
    config:
      source_mode: snapshot
      required_env: []

  - source_id: clickhouse_feature_slice
    display_name: ClickHouse Feature Slice
    kind: source
    implementation_status: implemented
    supported_modes:
      - minimal_slice
    description: Read governed feature slice rows from ClickHouse using runtime query execution.
    config:
      source_mode: clickhouse
      required_env:
        - CLICKHOUSE_HOST
        - CLICKHOUSE_PORT
        - CLICKHOUSE_DB
        - CLICKHOUSE_USER
        - CLICKHOUSE_PASSWORD
        - CLICKHOUSE_FEATURE_SLICE_QUERY

  - source_id: crm_salesforce
    display_name: Salesforce CRM
    kind: source
    implementation_status: planned
    supported_modes:
      - future
    description: Planned CRM source connector (not implemented in this phase).
    config:
      source_mode: planned

  - source_id: acrm_internal
    display_name: Internal ACRM
    kind: source
    implementation_status: planned
    supported_modes:
      - future
    description: Planned ACRM source connector (not implemented in this phase).
    config:
      source_mode: planned

  - source_id: dwh_snowflake
    display_name: Snowflake DWH
    kind: source
    implementation_status: planned
    supported_modes:
      - future
    description: Planned DWH source connector (not implemented in this phase).
    config:
      source_mode: planned

exports:
  - export_id: local_jsonl
    display_name: Local JSONL Export
    kind: export
    implementation_status: implemented
    description: Write approved audience rows to local JSONL path.
    config:
      write_local_file: true
      upload_to_minio: false

  - export_id: minio_jsonl
    display_name: MinIO JSONL Export
    kind: export
    implementation_status: implemented
    description: Write approved audience locally then upload to MinIO object storage.
    config:
      write_local_file: true
      upload_to_minio: true
      required_env:
        - MINIO_ENDPOINT
        - MINIO_ACCESS_KEY
        - MINIO_SECRET_KEY
        - MINIO_BUCKET

  - export_id: postgres_export_table
    display_name: Postgres Export Staging Table
    kind: export
    implementation_status: implemented
    description: Write approved audience rows into managed Postgres staging table for downstream CRM/ACRM consumption.
    config:
      write_local_file: true
      write_postgres_table: true
      required_env:
        - EXPORT_POSTGRES_HOST
        - EXPORT_POSTGRES_PORT
        - EXPORT_POSTGRES_DB
        - EXPORT_POSTGRES_USER
        - EXPORT_POSTGRES_PASSWORD
        - EXPORT_POSTGRES_SCHEMA
        - EXPORT_POSTGRES_TABLE

  - export_id: crm_salesforce_audience
    display_name: Salesforce Audience Push
    kind: export
    implementation_status: planned
    description: Planned direct CRM audience export connector.
    config:
      write_local_file: false

profiles:
  - profile_id: local_snapshot_local_export
    display_name: Local Snapshot to Local Export
    implementation_status: implemented
    source_id: snapshot_jsonl
    export_id: local_jsonl
    field_mapping:
      customer_key: customer_id
      score_key: score
      segmentation_keys:
        - product_line
        - region_code
        - segment_id

  - profile_id: clickhouse_minio_export
    display_name: ClickHouse to MinIO Export
    implementation_status: implemented
    source_id: clickhouse_feature_slice
    export_id: minio_jsonl
    field_mapping:
      customer_key: customer_id
      score_key: score
      segmentation_keys:
        - product_line
        - region_code
        - segment_id

  - profile_id: clickhouse_postgres_export
    display_name: ClickHouse to Postgres Export Staging
    implementation_status: implemented
    source_id: clickhouse_feature_slice
    export_id: postgres_export_table
    field_mapping:
      customer_key: customer_id
      score_key: score
      segmentation_keys:
        - product_line
        - region_code
        - segment_id

  - profile_id: salesforce_future_profile
    display_name: Salesforce CRM Future Profile
    implementation_status: planned
    source_id: crm_salesforce
    export_id: crm_salesforce_audience
    field_mapping:
      customer_key: external_customer_id
